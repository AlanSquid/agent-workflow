schema: spec-driven

# Injected into every artifact generation (proposal, specs, design, tasks).
context: |
  {{PROJECT_CONTEXT}}

rules:
  proposal:
    - 列出 Non-goals，避免範圍蔓延
    - 若有會改變 specs、做法或 task 拆法的未決事項，先停下來依 .agents/skills/grilling/SKILL.md 的方式分輪問使用者，不要自行假設；已經 grill 過、沒有未決事項就直接寫
  design:
    - 跟既有行為不一致的地方要明確列出，並說明怎麼處理
  tasks:
    - 切 task group 時依 .agents/skills/to-tickets/SKILL.md 的「Draft vertical slices」方法（先做 prefactor、wide refactor 走 expand–contract、每組塞得進一個新的 context window），每個 task group 就是一張票；不執行它的「Publish」步驟：不寫 .scratch/、不發布到外部 tracker，只寫這份 tasks.md
    - 超過一個 task group 時，寫檔前先依 to-tickets 的「Quiz the user」把切法給使用者確認
    - 任務必須垂直切片：每個 task group 是一組可以由人驗收的完整行為，並寫出驗收用的指令
    - {{VERTICAL_SLICE_DEFINITION}}
    - 第一個 task group 必須是 walking skeleton：功能最窄但打通全部環節，並包含可執行的測試（含測試基礎設施本身）
    - 每個 task group 都要標註 `Blocked by:`
    - 碰到外部 API 的切片，先用 fake adapter 打通、以對方文件為契約，adapter 介面在第一個相關 group 定案，不打真 API
    - 純基礎設施工作不硬套垂直切片，照工作本身的結構拆
    - 內容以{{DOC_LANGUAGE}}撰寫；技術術語與識別字保留英文
    - Markdown 排版：標題、清單、code fence 前後空一行；code fence 標語言；不用粗體行當標題
